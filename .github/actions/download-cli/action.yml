name: 'Download CLI Binary'
description: 'Downloads revancex Linux CLI binary and adds it to PATH, falls back to cargo build from source'

inputs:
  github_token:
    description: 'GitHub token for API authentication'
    required: true
  tag:
    description: 'Release tag to download (empty for latest)'
    required: false
    default: ''
  force_build:
    description: 'Force build CLI from source rather than downloading pre-built binary'
    required: false
    default: 'false'

outputs:
  cli_source:
    description: 'Whether CLI was downloaded pre-built or built from source'
    value: ${{ steps.download.outputs.cli_source }}

runs:
  using: 'composite'
  steps:
    - name: Download and unpack revancex CLI
      id: download
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        FORCE_BUILD: ${{ inputs.force_build }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        mkdir -p bin
        CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
        TARGET_TAG="$INPUT_TAG"
        if [ -z "$TARGET_TAG" ]; then
          TARGET_TAG="v${CARGO_VER}"
        fi

        CLI_URL="https://github.com/${GITHUB_REPO}/releases/download/${TARGET_TAG}/revancex-linux-x86_64.tar.gz"

        export CARGO_TERM_COLOR=always CARGO_TERM_PROGRESS_WHEN=never
        mkdir -p build/logs bin

        if [ -f scripts/ci-log.sh ]; then
          source scripts/ci-log.sh
        fi

        DOWNLOADED=false
        if [ "$FORCE_BUILD" = "true" ]; then
          if type step_skip >/dev/null 2>&1; then
            step_skip "Download pre-built CLI (${TARGET_TAG})" "force_build=true"
          else
            echo "↷ CLI ${TARGET_TAG}: force_build=true"
          fi
        else
          if type step_run >/dev/null 2>&1; then
            if step_run "Download pre-built CLI (${TARGET_TAG})" bash -c "curl -sSLf \"$CLI_URL\" | tar -xz -C bin/"; then
              DOWNLOADED=true
            else
              step_skip "Download pre-built CLI (${TARGET_TAG})" "not found in release assets"
            fi
          else
            if curl -sSLf "$CLI_URL" | tar -xz -C bin/; then
              DOWNLOADED=true
            fi
          fi
        fi

        if [ "$DOWNLOADED" = "false" ]; then
          echo "::warning title=CLI built from source::No pre-built CLI release for ${TARGET_TAG}; building from source."
          echo "cli_source=built from source" >> "$GITHUB_OUTPUT"
          echo "CLI_SOURCE=built from source" >> "$GITHUB_ENV"
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            source "$HOME/.cargo/env"
          fi
          if type step_run >/dev/null 2>&1; then
            step_run "Build CLI from source (${TARGET_TAG})" cargo build --release --locked --quiet
          else
            cargo build --release --locked --quiet
          fi
          cp target/release/revancex bin/revancex
        else
          echo "cli_source=pre-built binary" >> "$GITHUB_OUTPUT"
          echo "CLI_SOURCE=pre-built binary" >> "$GITHUB_ENV"
        fi

        chmod +x bin/revancex*
        echo "$PWD/bin" >> "$GITHUB_PATH"
