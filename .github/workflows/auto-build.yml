name: Auto Build

on:
  workflow_call:
    inputs:
      apps:
        description: 'Apps to build (or "all")'
        required: false
        default: 'all'
        type: string
      skip_fail_threshold:
        description: 'Skip fail_threshold check on build report validation'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      apps:
        description: 'Apps to build (or "all")'
        required: false
        default: 'all'
        type: string
      skip_fail_threshold:
        description: 'Skip fail_threshold check on build report validation'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: revancex-release-write
  cancel-in-progress: false

jobs:
  build:
    name: Auto Build
    uses: ./.github/workflows/build-and-release.yml
    with:
      apps: ${{ inputs.apps || 'all' }}
      arch: arm64-v8a
      tag_prefix: auto
      prerelease: false
      make_latest: true
      build_single_modules: true
      skip_fail_threshold: ${{ inputs.skip_fail_threshold == true }}
    secrets: inherit

  pages:
    name: Update Catalogue
    needs: build
    if: success()
    uses: ./.github/workflows/update-pages.yml
    secrets: inherit
