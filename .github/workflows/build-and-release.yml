name: Build and Release

on:
  workflow_call:
    inputs:
      apps:
        description: 'Apps to build (or "all")'
        required: false
        default: 'all'
        type: string
      arch:
        description: 'Target architecture'
        required: false
        default: 'arm64-v8a'
        type: string
      tag_prefix:
        description: 'Release tag prefix'
        required: false
        default: 'auto'
        type: string
      release_title:
        description: 'Release title'
        required: false
        default: ''
        type: string
      release_note:
        description: 'Release body note'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Whether release is a prerelease'
        required: false
        default: false
        type: boolean
      make_latest:
        description: 'Whether to mark release as latest'
        required: false
        default: false
        type: boolean
      build_single_modules:
        description: 'Whether to build single Magisk modules for each app'
        required: false
        default: false
        type: boolean
    outputs:
      release_tag:
        description: 'Created release tag'
        value: ${{ jobs.build.outputs.release_tag }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
        ports:
          - 8191:8191
        options: --shm-size=1gb
    outputs:
      release_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for FlareSolverr
        continue-on-error: true
        run: |
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:8191/ > /dev/null; then
              echo "FlareSolverr is ready!"
              exit 0
            fi
            echo "Waiting for FlareSolverr ($i/30)..."
            sleep 5
          done
          echo "::warning::FlareSolverr wait timed out; continuing without solver."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-and-release

      - name: Cache revancex CLI binary
        id: cache_cli
        uses: actions/cache@v4
        with:
          path: bin/revancex
          key: revancex-cli-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**') }}

      - name: Add bin to PATH
        if: steps.cache_cli.outputs.cache-hit == 'true'
        run: |
          chmod +x bin/revancex
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Download CLI
        if: steps.cache_cli.outputs.cache-hit != 'true'
        uses: ./.github/actions/download-cli
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_build: 'true'

      - name: Cache & install download accelerator (aria2)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: aria2
          version: 1.0

      - name: Install apkeep APK downloader
        run: |
          sudo curl -sSLf https://github.com/EFForg/apkeep/releases/download/1.1.0/apkeep-x86_64-unknown-linux-gnu -o /usr/local/bin/apkeep
          sudo chmod +x /usr/local/bin/apkeep
          apkeep --version

      - name: Restore patch tools cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/
          key: tools-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tools-${{ runner.os }}-

      - name: Download tools
        id: tools
        run: revancex download-tools --apps "${{ inputs.apps || 'all' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean stale tools
        run: revancex clean --stale-tools

      - name: Save patch tools cache
        if: always() && steps.tools.outputs.tools_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tools/
          key: tools-${{ runner.os }}-${{ github.run_id }}

      - name: Validate configuration
        run: revancex validate --apps "${{ inputs.apps || 'all' }}"

      - name: Build apps
        run: |
          mkdir -p output
          revancex build \
            --apps "${{ inputs.apps || 'all' }}" \
            --arch "${{ inputs.arch }}" \
            --keep-going \
            --output output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLARESOLVERR_URL: http://localhost:8191/v1
          TRAWL_URL: ${{ secrets.TRAWL_URL }}

      - name: Write attempted sources to GITHUB_STEP_SUMMARY
        if: always()
        run: |
          python3 scripts/summarize_build_report.py

      - name: Upload Build Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ inputs.tag_prefix }}-${{ inputs.arch }}
          path: output/BUILD_REPORT.json
          if-no-files-found: warn

      - name: Validate Build Report
        run: revancex report check output/BUILD_REPORT.json --fail-threshold 40

      - name: Verify build produced output
        run: |
          count=$(find output -maxdepth 1 \( -name '*.apk' -o -name '*.zip' \) -type f 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::Build produced zero APK/ZIP files in output/. Aborting release pipeline."
            exit 1
          fi
          echo "Build OK: $count output file(s) found."

      - name: Build bundle modules
        run: |
          if [ "${{ inputs.tag_prefix }}" = "custom" ]; then
            revancex module \
              --bundle \
              --apps "${{ inputs.apps }}" \
              --include-webui \
              --output output
          else
            revancex module \
              --bundle \
              --apps all \
              --include-webui \
              --output output
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build single modules for enabled apps
        if: inputs.build_single_modules
        run: |
          FAILED_MODULES=""
          for apk in output/*.apk; do
            [ -f "$apk" ] || continue
            fname=$(basename "$apk")
            appid="${fname%.apk}"
            appid="${appid%-patched}"
            [ "$appid" = "microg" ] && continue
            echo "Building single module for: $appid"
            if ! revancex module --single --apps "$appid" --output output; then
              echo "::error::Single module build failed for $appid"
              FAILED_MODULES="$FAILED_MODULES $appid"
            fi
          done

          if [ -n "$FAILED_MODULES" ]; then
            echo "### ⚠️ Single Module Build Failures" >> $GITHUB_STEP_SUMMARY
            echo "Failed apps:$FAILED_MODULES" >> $GITHUB_STEP_SUMMARY
            echo "::warning::Failed single module builds for:$FAILED_MODULES"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test built APKs
        run: |
          REVANCEX_STATIC_TEST=1 revancex test \
            --output output \
            --apps "${{ inputs.apps || 'all' }}" \
            --continue

      - name: Resolve Release Metadata
        id: meta
        run: |
          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          DATE_STR=$(date -u +'%Y.%m.%d')
          TAG="${{ inputs.tag_prefix }}-v${CARGO_VER}-${DATE_STR}-b${{ github.run_number }}"

          TITLE="${{ inputs.release_title }}"
          if [ -z "$TITLE" ]; then
            if [ "${{ inputs.tag_prefix }}" = "custom" ]; then
              TITLE="Custom Bundle — ${{ inputs.apps }} (${DATE_STR})"
            else
              TITLE="ReVanceX Apps & Modules — ${DATE_STR} (Build #${{ github.run_number }})"
            fi
          fi

          BODY="${{ inputs.release_note }}"
          if [ -z "$BODY" ]; then
            if [ "${{ inputs.tag_prefix }}" = "custom" ]; then
              BODY=$(printf "Custom bundle requested via GitHub Pages.\n- **Apps**: %s\n- **Arch**: %s\n- **CLI Version**: \`v%s\`\n- **Date**: %s" "${{ inputs.apps }}" "${{ inputs.arch }}" "$CARGO_VER" "$DATE_STR")
            else
              BODY=$(printf "## %s\n\nAutomatic build triggered by schedule or patch updates.\n- **CLI Version**: \`v%s\`\n- **Date**: %s" "$TITLE" "$CARGO_VER" "$DATE_STR")
            fi
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "version=$CARGO_VER" >> $GITHUB_OUTPUT
          echo "date=$DATE_STR" >> $GITHUB_OUTPUT
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Verify and cap asset sizes for release upload
        run: |
          for f in output/*; do
            [ -f "$f" ] || continue
            fsize=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
            if [ "$fsize" -gt 2000000000 ]; then
              echo "Warning: $f exceeds 2GB ($fsize bytes), removing before release upload to prevent failure"
              rm -f "$f"
            fi
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: ${{ steps.meta.outputs.body }}
          files: |
            output/*.apk
            output/*.zip
          fail_on_unmatched_files: false
          make_latest: ${{ inputs.make_latest }}
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old automated releases
        if: inputs.tag_prefix == 'auto'
        continue-on-error: true
        run: |
          echo "Pruning older automated releases (retaining latest 10)..."
          gh release list --limit 40 | grep '^auto-' | awk '{print $1}' | tail -n +11 | while read -r old_tag; do
            echo "Deleting old release: $old_tag"
            if ! gh release delete "$old_tag" --cleanup-tag -y; then
              echo "Warning: could not delete release $old_tag, skipping..."
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache pip dependencies
        id: cache_pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python script dependencies
        run: pip install --quiet -r scripts/requirements.txt

      - name: Update README tables and send Telegram notification
        run: |
          python3 scripts/update_readme_and_notify.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          OUTPUT_DIR: output
          TG_CHAT: ${{ secrets.TG_CHAT || secrets.TELEGRAM_CHAT_ID }}
          TG_TOKEN: ${{ secrets.TG_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_TOPIC: ${{ secrets.TG_TOPIC || secrets.TG_THREAD_ID || secrets.TELEGRAM_TOPIC_ID }}

      - name: Regenerate docs/apps.json with release registry
        run: |
          revancex gen-apps-json --registry config/releases_registry.json

      - name: Update version cache
        run: |
          revancex check-updates --json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload updated docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/
          if-no-files-found: warn

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-binary
          path: bin/revancex
          if-no-files-found: ignore

      - name: Commit and push updated README & release registry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md config/releases_registry.json docs/apps.json config/version_cache.json config/modules.yaml
          # [skip ci] is mandatory in commit messages to prevent triggering release-cli.yml via config/** path filters
          if [ "${{ inputs.tag_prefix }}" = "custom" ]; then
            COMMIT_MSG="docs: update custom bundle registry for ${{ steps.meta.outputs.tag }} [skip ci]"
          else
            COMMIT_MSG="docs: auto-update apps and modules registry for ${{ steps.meta.outputs.tag }} [skip ci]"
          fi
          git diff --staged --quiet || git commit -m "$COMMIT_MSG"
          # Discard any leftover untracked/unstaged working-tree changes before rebase
          git checkout -- . 2>/dev/null || :
          PUSH_OK=false
          for i in 1 2 3 4 5; do
            git fetch origin ${{ github.ref_name }}
            if ! git rebase origin/${{ github.ref_name }}; then
              git rebase --abort 2>/dev/null || :
            fi
            if git push origin HEAD:${{ github.ref }}; then
              PUSH_OK=true
              break
            fi
            echo "Push failed, retrying in 3s (attempt $i of 5)..."
            sleep 3
          done
          if [ "$PUSH_OK" != "true" ]; then
            echo "::error::Failed to push updated README and releases registry after 5 attempts"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Build Summary
        if: always()
        run: |
          echo "## 🚀 ReVanceX Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Apps** | \`${{ inputs.apps || 'all' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Arch** | \`${{ inputs.arch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **CLI Source** | \`${{ env.CLI_SOURCE || 'unknown' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Job Status** | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
          TOOLS_HIT="${{ steps.cache_tools.outputs.cache-hit }}"
          PIP_HIT="${{ steps.cache_pip.outputs.cache-hit }}"
          echo "| **Tools Cache** | \`$([ "$TOOLS_HIT" = "true" ] && echo "✅ Hit" || echo "⚠️ Miss")\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pip Cache** | \`$([ "$PIP_HIT" = "true" ] && echo "✅ Hit" || echo "⚠️ Miss")\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Output Artifacts" >> $GITHUB_STEP_SUMMARY
          if [ -d output ] && [ "$(ls -A output 2>/dev/null)" ]; then
            echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            for f in output/*; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              fsize=$(ls -lh "$f" | awk '{print $5}')
              echo "| \`$fname\` | $fsize |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No output artifacts produced." >> $GITHUB_STEP_SUMMARY
          fi
