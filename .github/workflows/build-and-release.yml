name: Build and Release

on:
  workflow_call:
    inputs:
      apps:
        description: 'Apps to build (or "all")'
        required: false
        default: 'all'
        type: string
      arch:
        description: 'Target architecture'
        required: false
        default: 'arm64-v8a'
        type: string
      tag_prefix:
        description: 'Release tag prefix'
        required: false
        default: 'auto'
        type: string
      release_title:
        description: 'Release title'
        required: false
        default: ''
        type: string
      release_note:
        description: 'Release body note'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Whether release is a prerelease'
        required: false
        default: false
        type: boolean
      make_latest:
        description: 'Whether to mark release as latest'
        required: false
        default: false
        type: boolean
      build_single_modules:
        description: 'Whether to build single Magisk modules for each app'
        required: false
        default: false
        type: boolean
    outputs:
      release_tag:
        description: 'Created release tag'
        value: ${{ jobs.build.outputs.release_tag }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-and-release

      - name: Download CLI
        uses: ./.github/actions/download-cli
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache & install download accelerator (aria2)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: aria2
          version: 1.0

      - name: Cache patch tools & version cache
        id: cache_tools
        uses: actions/cache@v6
        with:
          path: |
            tools/
            tmp/version_cache.json
          key: tools-${{ hashFiles('config/apps.yaml', 'config/sources.yaml') }}
          restore-keys: |
            tools-

      - name: Download tools
        run: revancex download-tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate configuration
        run: revancex validate --strict

      - name: Build apps
        run: |
          mkdir -p output
          revancex build \
            --apps "${{ inputs.apps || 'all' }}" \
            --arch "${{ inputs.arch }}" \
            --keep-going \
            --output output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Verify build produced output
        run: |
          count=$(find output -maxdepth 1 \( -name '*.apk' -o -name '*.zip' \) -type f 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::Build produced zero APK/ZIP files in output/. Aborting release pipeline."
            exit 1
          fi
          echo "Build OK: $count output file(s) found."

      - name: Build bundle modules
        run: |
          if [ "${{ inputs.tag_prefix }}" = "custom" ]; then
            revancex module \
              --bundle \
              --apps "${{ inputs.apps }}" \
              --include-webui \
              --output output
          else
            revancex module \
              --bundle \
              --apps all \
              --include-webui \
              --output output
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build single modules for enabled apps
        if: inputs.build_single_modules
        run: |
          FAILED_MODULES=""
          for apk in output/*.apk; do
            [ -f "$apk" ] || continue
            fname=$(basename "$apk")
            appid="${fname%.apk}"
            appid="${appid%-patched}"
            appid="${appid%-root}"
            [ "$appid" = "microg" ] && continue
            echo "Building single module for: $appid"
            if ! revancex module --single --apps "$appid" --output output; then
              echo "::error::Single module build failed for $appid"
              FAILED_MODULES="$FAILED_MODULES $appid"
            fi
          done

          if [ -n "$FAILED_MODULES" ]; then
            echo "### ❌ Single Module Build Failures" >> $GITHUB_STEP_SUMMARY
            echo "Failed apps:$FAILED_MODULES" >> $GITHUB_STEP_SUMMARY
            echo "::error::Failed single module builds for:$FAILED_MODULES"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test built APKs
        run: |
          revancex test --output output --apps "${{ inputs.apps }}"

      - name: Resolve Release Metadata
        id: meta
        run: |
          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          DATE_STR=$(date -u +'%Y.%m.%d')
          TAG="${{ inputs.tag_prefix }}-v${CARGO_VER}-${DATE_STR}-b${{ github.run_number }}"

          TITLE="${{ inputs.release_title }}"
          if [ -z "$TITLE" ]; then
            if [ "${{ inputs.tag_prefix }}" = "custom" ]; then
              TITLE="Custom Bundle — ${{ inputs.apps }} (${DATE_STR})"
            else
              TITLE="ReVanceX Apps & Modules — ${DATE_STR} (Build #${{ github.run_number }})"
            fi
          fi

          BODY="${{ inputs.release_note }}"
          if [ -z "$BODY" ]; then
            if [ "${{ inputs.tag_prefix }}" = "custom" ]; then
              BODY=$(printf "Custom bundle requested via GitHub Pages.\n- **Apps**: %s\n- **Arch**: %s\n- **CLI Version**: \`v%s\`\n- **Date**: %s" "${{ inputs.apps }}" "${{ inputs.arch }}" "$CARGO_VER" "$DATE_STR")
            else
              BODY=$(printf "## %s\n\nAutomatic build triggered by schedule or patch updates.\n- **CLI Version**: \`v%s\`\n- **Date**: %s" "$TITLE" "$CARGO_VER" "$DATE_STR")
            fi
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "version=$CARGO_VER" >> $GITHUB_OUTPUT
          echo "date=$DATE_STR" >> $GITHUB_OUTPUT
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Verify and cap asset sizes for release upload
        run: |
          for f in output/*; do
            [ -f "$f" ] || continue
            fsize=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
            if [ "$fsize" -gt 2000000000 ]; then
              echo "Warning: $f exceeds 2GB ($fsize bytes), removing before release upload to prevent failure"
              rm -f "$f"
            fi
          done

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: ${{ steps.meta.outputs.body }}
          files: |
            output/*.apk
            output/*.zip
          fail_on_unmatched_files: false
          make_latest: ${{ inputs.make_latest }}
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache pip dependencies
        id: cache_pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python script dependencies
        run: pip install --quiet -r scripts/requirements.txt

      - name: Update README tables and send Telegram notification
        run: |
          python3 scripts/update_readme_and_notify.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          OUTPUT_DIR: output
          TG_CHAT: ${{ secrets.TG_CHAT || secrets.TELEGRAM_CHAT_ID }}
          TG_TOKEN: ${{ secrets.TG_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_TOPIC: ${{ secrets.TG_TOPIC || secrets.TG_THREAD_ID || secrets.TELEGRAM_TOPIC_ID }}

      - name: Regenerate docs/apps.json with release registry
        run: |
          revancex gen-apps-json --registry config/releases_registry.json

      - name: Upload updated docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/
          if-no-files-found: warn

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-binary
          path: bin/revancex
          if-no-files-found: ignore

      - name: Commit and push updated README & release registry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md config/releases_registry.json docs/apps.json
          # [skip ci] is mandatory in commit messages to prevent triggering release-cli.yml via config/** path filters
          if [ "${{ inputs.tag_prefix }}" = "custom" ]; then
            COMMIT_MSG="docs: update custom bundle registry for ${{ steps.meta.outputs.tag }} [skip ci]"
          else
            COMMIT_MSG="docs: auto-update apps and modules registry for ${{ steps.meta.outputs.tag }} [skip ci]"
          fi
          git diff --quiet && git diff --staged --quiet || git commit -m "$COMMIT_MSG"
          PUSH_OK=false
          for i in 1 2 3 4 5; do
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || git rebase --abort
            if git push origin HEAD:${{ github.ref }}; then
              PUSH_OK=true
              break
            fi
            echo "Push failed, retrying in 3s (attempt $i of 5)..."
            sleep 3
          done
          if [ "$PUSH_OK" != "true" ]; then
            echo "::error::Failed to push updated README and releases registry after 5 attempts"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Build Summary
        if: always()
        run: |
          echo "## 🚀 ReVanceX Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Apps** | \`${{ inputs.apps || 'all' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Arch** | \`${{ inputs.arch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **CLI Source** | \`${{ env.CLI_SOURCE || 'unknown' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Job Status** | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
          TOOLS_HIT="${{ steps.cache_tools.outputs.cache-hit }}"
          PIP_HIT="${{ steps.cache_pip.outputs.cache-hit }}"
          echo "| **Tools Cache** | \`$([ "$TOOLS_HIT" = "true" ] && echo "✅ Hit" || echo "⚠️ Miss")\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pip Cache** | \`$([ "$PIP_HIT" = "true" ] && echo "✅ Hit" || echo "⚠️ Miss")\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Output Artifacts" >> $GITHUB_STEP_SUMMARY
          if [ -d output ] && [ "$(ls -A output 2>/dev/null)" ]; then
            echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            for f in output/*; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              fsize=$(ls -lh "$f" | awk '{print $5}')
              echo "| \`$fname\` | $fsize |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No output artifacts produced." >> $GITHUB_STEP_SUMMARY
          fi
