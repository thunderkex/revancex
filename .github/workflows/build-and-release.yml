name: Build and Release

on:
  workflow_call:
    inputs:
      apps:
        description: 'Apps to build (or "all")'
        required: false
        default: 'all'
        type: string
      arch:
        description: 'Target architecture'
        required: false
        default: 'arm64-v8a'
        type: string
      tag_prefix:
        description: 'Release tag prefix'
        required: false
        default: 'auto'
        type: string
      release_title:
        description: 'Release title'
        required: false
        default: ''
        type: string
      release_note:
        description: 'Release body note'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Whether release is a prerelease'
        required: false
        default: false
        type: boolean
      make_latest:
        description: 'Whether to mark release as latest'
        required: false
        default: true
        type: boolean
      build_single_modules:
        description: 'Whether to build single Magisk modules for each app'
        required: false
        default: false
        type: boolean
      mode:
        description: 'Optional optimization mode override (full|lite)'
        required: false
        default: ''
        type: string
      packaging:
        description: 'Packaging mode (all|bundle|single_module|apk)'
        required: false
        default: 'all'
        type: string
      include_webui:
        description: 'Include embedded Material WebUI in module zips'
        required: false
        default: true
        type: boolean
      skip_fail_threshold:
        description: 'Skip fail_threshold check on build report validation'
        required: false
        default: false
        type: boolean
    outputs:
      release_tag:
        description: 'Created release tag'
        value: ${{ jobs.build.outputs.release_tag }}

permissions:
  contents: read

# Quiet, uniform tool output. Raw tool output is captured under build/logs/
# (uploaded as an artifact). Re-running with "Enable debug logging" sets
# RUNNER_DEBUG=1, which revancex treats as --verbose.
env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: never
  REVANCEX_LOG_DIR: build/logs

jobs:
  build:
    name: Build & Release (${{ inputs.apps || 'all' }} · ${{ inputs.arch }})
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
        ports:
          - 8191:8191
        options: --shm-size=1gb
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8000:8191
        env:
          SESSION_CACHE_DRIVER: memory
          BROWSER_POOL_SIZE: 1
        options: --shm-size=1gb
    outputs:
      release_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Wait for FlareSolverr
        continue-on-error: true
        shell: bash
        run: |
          source scripts/ci-log.sh
          step_run "Wait for FlareSolverr" bash -c '
            for i in $(seq 1 30); do
              if curl -sS -f http://localhost:8191/ > /dev/null 2>&1; then
                echo "FlareSolverr is ready (attempt $i/30)"
                exit 0
              fi
              sleep 5
            done
            echo "FlareSolverr wait timed out after 30 attempts; continuing without solver"
            exit 1
          '

      - name: Wait for Trawl
        continue-on-error: true
        shell: bash
        run: |
          source scripts/ci-log.sh
          step_run "Wait for Trawl" bash -c '
            for i in $(seq 1 30); do
              if curl -sS -f http://localhost:8000/health > /dev/null 2>&1; then
                echo "Trawl is ready (attempt $i/30)"
                exit 0
              fi
              sleep 5
            done
            echo "Trawl wait timed out after 30 attempts; continuing without trawl"
            exit 1
          '

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-and-release

      - name: Cache revancex CLI binary
        id: cache_cli
        uses: actions/cache@v6
        with:
          path: bin/revancex
          key: revancex-cli-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**') }}

      - name: Add bin to PATH
        if: steps.cache_cli.outputs.cache-hit == 'true'
        run: |
          chmod +x bin/revancex
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Download CLI
        if: steps.cache_cli.outputs.cache-hit != 'true'
        uses: ./.github/actions/download-cli
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_build: 'true'

      - name: Cache & install download accelerator (aria2)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: aria2
          version: 1.0

      - name: Install apkeep APK downloader
        shell: bash
        run: |
          source scripts/ci-log.sh
          step_run "Install apkeep downloader" bash -c '
            sudo curl -sSLf https://github.com/EFForg/apkeep/releases/download/1.1.0/apkeep-x86_64-unknown-linux-gnu -o /usr/local/bin/apkeep
            sudo chmod +x /usr/local/bin/apkeep
            apkeep --version
          '

      - name: Restore patch tools cache
        uses: actions/cache/restore@v6
        with:
          path: |
            tools/
          key: tools-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tools-${{ runner.os }}-

      - name: Download tools
        id: tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_APPS: ${{ inputs.apps || 'all' }}
        run: |
          source scripts/ci-log.sh
          step_run "Download patch tools" revancex download-tools --apps "$INPUT_APPS"

      - name: Clean stale tools
        shell: bash
        run: |
          source scripts/ci-log.sh
          step_run "Clean stale tools" revancex clean --stale-tools

      - name: Save patch tools cache
        if: always() && steps.tools.outputs.tools_changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            tools/
          key: tools-${{ runner.os }}-${{ github.run_id }}

      - name: Validate configuration
        shell: bash
        env:
          INPUT_APPS: ${{ inputs.apps || 'all' }}
        run: |
          source scripts/ci-log.sh
          step_run "Validate configuration" revancex validate --apps "$INPUT_APPS"

      - name: Build apps
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          FLARESOLVERR_URL: http://localhost:8191/v1
          TRAWL_URL: http://localhost:8000
          REVANCEX_APKEEP_ACKNOWLEDGE_DANGERS: "true"
          INPUT_APPS: ${{ inputs.apps || 'all' }}
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          source scripts/ci-log.sh
          mkdir -p output build/logs
          MODE_ARGS=()
          if [ -n "$INPUT_MODE" ]; then
            MODE_ARGS=(--mode "$INPUT_MODE")
          fi
          step_run "Build apps (${INPUT_APPS}-${INPUT_ARCH})" revancex build \
            --apps "$INPUT_APPS" \
            --arch "$INPUT_ARCH" \
            "${MODE_ARGS[@]}" \
            --keep-going \
            --output output

      - name: Upload detailed build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ inputs.tag_prefix }}-${{ inputs.arch }}
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Write attempted sources to GITHUB_STEP_SUMMARY
        if: always()
        shell: bash
        run: |
          source scripts/ci-log.sh
          step_run "Summarize attempted sources" python3 scripts/summarize_build_report.py

      - name: Upload Build Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-report-${{ inputs.tag_prefix }}-${{ inputs.arch }}
          path: output/BUILD_REPORT.json
          if-no-files-found: warn

      - name: Validate Build Report
        shell: bash
        env:
          SKIP_FAIL_THRESHOLD: ${{ inputs.skip_fail_threshold }}
        run: |
          source scripts/ci-log.sh
          if [ "$SKIP_FAIL_THRESHOLD" = "true" ]; then
            step_run "Validate build report (fail_threshold skipped)" revancex report check output/BUILD_REPORT.json --continue
          else
            step_run "Validate build report" revancex report check output/BUILD_REPORT.json --fail-threshold 40
          fi

      - name: Verify build produced output
        run: |
          count=$(find output -maxdepth 1 \( -name '*.apk' -o -name '*.zip' \) -type f 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error title=No artifacts::Build produced zero APK/ZIP files in output/. Aborting release pipeline."
            exit 1
          fi
          echo "✔ build output: $count file(s)"

      - name: Resolve Release Metadata
        id: meta
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_NOTE: ${{ inputs.release_note }}
          INPUT_APPS: ${{ inputs.apps }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          DATE_STR=$(date -u +'%Y.%m.%d')
          YMD=$(date -u +'%Y%m%d')
          TAG="${TAG_PREFIX}-v${CARGO_VER}-${DATE_STR}-b${RUN_NUMBER}"

          VERSION_CODE=$(YMD="$YMD" python3 - <<'PY'
          import json, os
          ymd = os.environ["YMD"]
          base = int(ymd) * 100
          max_bb = 0
          reg_path = "config/releases_registry.json"
          if os.path.exists(reg_path):
              with open(reg_path, "r", encoding="utf-8") as f:
                  reg = json.load(f)
              for bucket in ("single_modules", "bundles", "custom_bundles"):
                  for item in (reg.get(bucket) or {}).values():
                      vc = item.get("version_code")
                      if isinstance(vc, int) and base <= vc <= base + 99:
                          max_bb = max(max_bb, vc - base)
                      elif str(item.get("updated_at", "")).startswith(f"{ymd[:4]}-{ymd[4:6]}-{ymd[6:8]}"):
                          max_bb = max(max_bb, 1)
          bb = min(max_bb + 1, 99)
          print(base + bb)
          PY
          )

          TITLE="$RELEASE_TITLE"
          if [ -z "$TITLE" ]; then
            if [ "$TAG_PREFIX" = "custom" ]; then
              TITLE="Custom Bundle — ${INPUT_APPS} (${DATE_STR})"
            else
              TITLE="ReVanceX Apps & Modules — ${DATE_STR} (Build #${RUN_NUMBER})"
            fi
          fi

          BODY="$RELEASE_NOTE"
          if [ -z "$BODY" ]; then
            if [ "$TAG_PREFIX" = "custom" ]; then
              BODY=$(printf "Custom bundle requested via GitHub Pages.\n- **Apps**: %s\n- **Arch**: %s\n- **CLI Version**: \`v%s\`\n- **Date**: %s" "$INPUT_APPS" "$INPUT_ARCH" "$CARGO_VER" "$DATE_STR")
            else
              BODY=$(printf "## %s\n\nAutomatic build triggered by schedule or patch updates.\n- **CLI Version**: \`v%s\`\n- **Date**: %s" "$TITLE" "$CARGO_VER" "$DATE_STR")
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "version=$CARGO_VER" >> "$GITHUB_OUTPUT"
          echo "date=$DATE_STR" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build bundle modules
        if: inputs.packaging == 'all' || inputs.packaging == 'bundle'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCLUDE_WEBUI: ${{ inputs.include_webui }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          INPUT_APPS: ${{ inputs.apps }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          source scripts/ci-log.sh
          WEBUI_FLAG="--include-webui"
          if [ "$INCLUDE_WEBUI" != "true" ]; then
            WEBUI_FLAG="--no-webui"
          fi
          if [ "$TAG_PREFIX" = "custom" ]; then
            step_run "Build bundle module (${INPUT_APPS})" revancex module \
              --bundle \
              --apps "$INPUT_APPS" \
              "$WEBUI_FLAG" \
              --version-code "$VERSION_CODE" \
              --release-tag "$RELEASE_TAG" \
              --output output
          else
            step_run "Build bundle module (all)" revancex module \
              --bundle \
              --apps all \
              "$WEBUI_FLAG" \
              --version-code "$VERSION_CODE" \
              --release-tag "$RELEASE_TAG" \
              --output output
          fi

      - name: Build single modules for enabled apps
        if: inputs.build_single_modules || inputs.packaging == 'single_module'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCLUDE_WEBUI: ${{ inputs.include_webui }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          source scripts/ci-log.sh
          WEBUI_FLAG="--include-webui"
          if [ "$INCLUDE_WEBUI" != "true" ]; then
            WEBUI_FLAG="--no-webui"
          fi
          FAILED_MODULES=""
          for apk in output/*.apk; do
            [ -f "$apk" ] || continue
            fname=$(basename "$apk")
            appid="${fname%.apk}"
            appid="${appid%-patched}"
            if [ "$appid" = "microg" ]; then
              step_skip "Build single module microg" "microg is standalone APK"
              continue
            fi
            if ! step_run "Build single module $appid" revancex module --single --apps "$appid" "$WEBUI_FLAG" --version-code "$VERSION_CODE" --release-tag "$RELEASE_TAG" --output output; then
              FAILED_MODULES="$FAILED_MODULES $appid"
            fi
          done

          if [ -n "$FAILED_MODULES" ]; then
            echo "**Single module failures:**$FAILED_MODULES" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Single modules::failed for:$FAILED_MODULES"
          fi

      - name: Smoke test built APKs
        shell: bash
        env:
          INPUT_APPS: ${{ inputs.apps || 'all' }}
        run: |
          source scripts/ci-log.sh
          step_run "Smoke test built APKs" env REVANCEX_STATIC_TEST=1 revancex test \
            --output output \
            --apps "$INPUT_APPS" \
            --continue

      - name: Verify and cap asset sizes for release upload
        run: |
          for f in output/*; do
            [ -f "$f" ] || continue
            fsize=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
            if [ "$fsize" -gt 2000000000 ] || [ "$fsize" -lt 1 ]; then
              echo "::warning title=Asset invalid size::$f has invalid size ($fsize bytes); removed before release upload"
              rm -f "$f"
            fi
          done

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: ${{ steps.meta.outputs.body }}
          files: |
            output/*.apk
            output/*.zip
          fail_on_unmatched_files: false
          make_latest: ${{ inputs.make_latest }}
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old automated releases
        if: inputs.tag_prefix == 'auto'
        continue-on-error: true
        run: |
          # keep the latest 10 automated releases; one line per deleted release
          gh release list --limit 40 | grep '^auto-' | awk '{print $1}' | tail -n +11 | while read -r old_tag; do
            if gh release delete "$old_tag" --cleanup-tag -y >/dev/null 2>&1; then
              echo "✔ pruned $old_tag"
            else
              echo "::warning title=Prune::could not delete release $old_tag; skipped"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache pip dependencies
        id: cache_pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python script dependencies
        run: pip install -q --disable-pip-version-check -r scripts/requirements.txt

      - name: Update README tables and send Telegram notification
        shell: bash
        run: |
          source scripts/ci-log.sh
          step_run "Update README and notify Telegram" python3 scripts/update_readme_and_notify.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          OUTPUT_DIR: output
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_TOPIC: ${{ secrets.TG_TOPIC }}

      - name: Regenerate docs/apps.json with release registry
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          source scripts/ci-log.sh
          step_run "Regenerate docs/apps.json" revancex gen-apps-json \
            --registry config/releases_registry.json \
            --report output/BUILD_REPORT.json \
            --test-report output/TEST_REPORT.json \
            --output-dir output \
            --release-tag "$RELEASE_TAG"

      - name: Update version cache
        if: inputs.tag_prefix == 'auto'
        shell: bash
        run: |
          source scripts/ci-log.sh
          step_run "Update version cache" revancex check-updates --json
          python3 - <<'PY'
          import json
          path = "config/version_cache.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          data.pop("negative_cache", None)
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload updated docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/
          if-no-files-found: warn

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-binary
          path: bin/revancex
          if-no-files-found: ignore

      - name: Commit and push updated README & release registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          TARGET_REF: ${{ github.ref }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md config/releases_registry.json docs/apps.json docs/update
          if [ "$TAG_PREFIX" = "auto" ] && [ -f config/version_cache.json ]; then
            git add config/version_cache.json
          fi
          if [ "$TAG_PREFIX" = "custom" ]; then
            COMMIT_MSG="docs: update custom bundle registry for ${RELEASE_TAG} [skip ci]"
          else
            COMMIT_MSG="docs: auto-update apps and modules registry for ${RELEASE_TAG} [skip ci]"
          fi
          git diff --staged --quiet || git commit -m "$COMMIT_MSG"
          # Discard any leftover untracked/unstaged working-tree changes before rebase
          git checkout -- . 2>/dev/null || :
          PUSH_OK=false
          for i in 1 2 3 4 5; do
            git fetch -q origin "$REF_NAME"
            if ! git rebase -q "origin/${REF_NAME}" >/dev/null 2>&1; then
              git rebase --abort 2>/dev/null || :
            fi
            if git push -q origin "HEAD:${TARGET_REF}"; then
              PUSH_OK=true
              echo "✔ pushed registry update (attempt $i/5)"
              break
            fi
            [ "$i" -lt 5 ] && sleep 3
          done
          if [ "$PUSH_OK" != "true" ]; then
            echo "::error title=Push failed::could not push README and releases registry after 5 attempts; re-run the job or push config/releases_registry.json manually"
            exit 1
          fi

      - name: Generate Build Summary
        if: always()
        shell: bash
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          source scripts/ci-log.sh
          step_summary "build-logs-${TAG_PREFIX}-${INPUT_ARCH}"
