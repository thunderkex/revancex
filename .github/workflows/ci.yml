name: CI Validation

on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [extended]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'Cargo.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [extended]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'Cargo.toml'

permissions:
  contents: read

# Quiet, uniform tool output (no colour-less progress spam in CI logs).
env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: never
  REVANCEX_LOG_DIR: build/logs

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-validate
          cache-on-failure: true

      - name: Code format check (cargo fmt)
        shell: bash
        run: |
          source scripts/ci-log.sh
          step_run "Format check (cargo fmt)" cargo fmt --check

      - name: Linter check (cargo clippy)
        shell: bash
        run: |
          source scripts/ci-log.sh
          step_run "Linter check (cargo clippy)" cargo clippy --quiet --all-targets -- -D warnings

      - name: Run unit & integration tests
        shell: bash
        run: |
          source scripts/ci-log.sh
          step_run "Run tests (cargo test)" cargo test --quiet

      # pip cache skips PyPI network round-trips; pip install --quiet no-ops fast on warm cache
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Smoke-test Python scripts
        shell: bash
        run: |
          source scripts/ci-log.sh
          pip install -q --disable-pip-version-check -r scripts/requirements.txt
          step_run "Smoke-test scripts" bash -c "python3 scripts/tests/test_update_readme.py && python3 scripts/tests/test_summarize_build_report.py && bash scripts/tests/test_ci_log.sh"

      - name: Validate config
        shell: bash
        run: |
          source scripts/ci-log.sh
          step_run "Validate config" cargo run --quiet -- validate

      - name: Validate apps.json generation and JSON Schema
        shell: bash
        run: |
          source scripts/ci-log.sh
          step_run "Validate apps.json schema" bash -c "
            cargo run --quiet -- gen-apps-json --registry config/releases_registry.json --out /tmp/apps1.json
            cargo run --quiet -- gen-apps-json --registry config/releases_registry.json --out /tmp/apps2.json
            diff -u /tmp/apps1.json /tmp/apps2.json
            python3 scripts/validate_apps_json.py /tmp/apps1.json docs/apps.schema.json
          "

      - name: Hygiene checks (clean patterns, no dead code)
        shell: bash
        run: |
          source scripts/ci-log.sh
          step_run "Hygiene checks" bash -c "! grep -rnF '|| true' --exclude-dir='.git' --exclude='ci.yml' .github/workflows/ && ! grep -rn 'allow(dead_code)' src/"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.job }}-main
          path: build/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Render Process Summary
        if: always()
        shell: bash
        run: |
          source scripts/ci-log.sh
          step_summary "build-logs-${{ github.job }}-main"
