name: CI Hygiene & Validation

on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [extended]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'Cargo.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [extended]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'Cargo.toml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Code format check (cargo fmt)
        run: cargo fmt --check

      - name: Linter check (cargo clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test

      - name: Validate config
        run: cargo run -- validate --strict

      - name: Hygiene checks (clean patterns, no dead code)
        run: |
          ! grep -rnF '|| true' --exclude-dir='.git' --exclude='ci.yml' .github/workflows/ || (echo "Found forbidden || true in workflows" && exit 1)
          ! grep -rn 'allow(dead_code)' src/ || (echo "Found dead code in src/" && exit 1)
