name: Custom Bundle Build

on:
  repository_dispatch:
    types: [custom-bundle-request]
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated app IDs to build'
        required: true
        default: 'youtube,youtube_music,microg'
        type: string
      arch:
        description: 'Target architecture'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - all
      mode:
        description: 'Optimization mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - lite
      packaging:
        description: 'Output packaging format'
        required: true
        default: 'bundle'
        type: choice
        options:
          - bundle
          - single_module
          - apk
      include_webui:
        description: 'Include embedded Material WebUI in module zips'
        required: false
        default: true
        type: boolean
      skip_fail_threshold:
        description: 'Skip fail_threshold check on build report validation'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: revancex-release-write
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve & Validate Inputs
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.inputs.outputs.apps }}
      arch: ${{ steps.inputs.outputs.arch }}
      mode: ${{ steps.inputs.outputs.mode }}
      packaging: ${{ steps.inputs.outputs.packaging }}
      include_webui: ${{ steps.inputs.outputs.include_webui }}
      skip_fail_threshold: ${{ steps.inputs.outputs.skip_fail_threshold }}
    steps:
      - name: Resolve and validate inputs (dispatch vs manual)
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_APPS: ${{ github.event.client_payload.apps }}
          PAYLOAD_ARCH: ${{ github.event.client_payload.arch }}
          PAYLOAD_MODE: ${{ github.event.client_payload.mode }}
          PAYLOAD_PACKAGING: ${{ github.event.client_payload.packaging }}
          PAYLOAD_INCLUDE_WEBUI: ${{ github.event.client_payload.include_webui }}
          PAYLOAD_SKIP_FAIL_THRESHOLD: ${{ github.event.client_payload.skip_fail_threshold }}
          INPUT_APPS: ${{ inputs.apps }}
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PACKAGING: ${{ inputs.packaging }}
          INPUT_INCLUDE_WEBUI: ${{ inputs.include_webui }}
          INPUT_SKIP_FAIL_THRESHOLD: ${{ inputs.skip_fail_threshold }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            APPS="$PAYLOAD_APPS"
            ARCH="$PAYLOAD_ARCH"
            MODE="$PAYLOAD_MODE"
            PACKAGING="$PAYLOAD_PACKAGING"
            WEBUI="$PAYLOAD_INCLUDE_WEBUI"
            SKIP_FAIL_THRESHOLD="$PAYLOAD_SKIP_FAIL_THRESHOLD"
          else
            APPS="$INPUT_APPS"
            ARCH="$INPUT_ARCH"
            MODE="$INPUT_MODE"
            PACKAGING="$INPUT_PACKAGING"
            WEBUI="$INPUT_INCLUDE_WEBUI"
            SKIP_FAIL_THRESHOLD="$INPUT_SKIP_FAIL_THRESHOLD"
          fi

          ARCH="${ARCH:-arm64-v8a}"
          MODE="${MODE:-full}"
          PACKAGING="${PACKAGING:-bundle}"
          WEBUI="${WEBUI:-true}"
          SKIP_FAIL_THRESHOLD="${SKIP_FAIL_THRESHOLD:-false}"

          if [ -z "$APPS" ] || ! echo "$APPS" | grep -Eq '^[a-zA-Z0-9_,.-]+$'; then
            echo "::error title=Invalid apps input::apps must be a non-empty comma-separated list of app IDs"
            exit 1
          fi

          case "$ARCH" in
            arm64-v8a|armeabi-v7a|x86_64|all) ;;
            *) echo "::error title=Invalid arch::$ARCH"; exit 1 ;;
          esac

          case "$MODE" in
            full|lite) ;;
            *) echo "::error title=Invalid mode::$MODE"; exit 1 ;;
          esac

          case "$PACKAGING" in
            bundle|single_module|apk) ;;
            *) echo "::error title=Invalid packaging::$PACKAGING"; exit 1 ;;
          esac

          case "$WEBUI" in
            true|false) ;;
            *) echo "::error title=Invalid include_webui::$WEBUI"; exit 1 ;;
          esac

          case "$SKIP_FAIL_THRESHOLD" in
            true|false) ;;
            *) echo "::error title=Invalid skip_fail_threshold::$SKIP_FAIL_THRESHOLD"; exit 1 ;;
          esac

          if [ "$PACKAGING" = "apk" ]; then
            WEBUI="false"
          fi

          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "packaging=$PACKAGING" >> "$GITHUB_OUTPUT"
          echo "include_webui=$WEBUI" >> "$GITHUB_OUTPUT"
          echo "skip_fail_threshold=$SKIP_FAIL_THRESHOLD" >> "$GITHUB_OUTPUT"

  build:
    name: Custom Build
    needs: resolve
    permissions:
      contents: write
    uses: ./.github/workflows/build-and-release.yml
    with:
      apps: ${{ needs.resolve.outputs.apps }}
      arch: ${{ needs.resolve.outputs.arch }}
      mode: ${{ needs.resolve.outputs.mode }}
      packaging: ${{ needs.resolve.outputs.packaging }}
      include_webui: ${{ needs.resolve.outputs.include_webui == 'true' }}
      tag_prefix: custom
      prerelease: true
      make_latest: false
      build_single_modules: ${{ needs.resolve.outputs.packaging == 'single_module' }}
      skip_fail_threshold: ${{ needs.resolve.outputs.skip_fail_threshold == 'true' }}
    secrets: inherit
